name: Refresh activity panel

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate-stats.mjs'
      - '.github/workflows/refresh-stats.yml'

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-stats.mjs

      - name: Commit if the panel changed
        run: |
          if [ -z "$(git status --porcelain assets/stats.svg)" ]; then
            echo "Panel is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git commit -m "chore: refresh activity panel"
          git push
