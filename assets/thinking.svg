<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 176" width="960" height="176" role="img" aria-labelledby="thinkTitle thinkDesc">
  <title id="thinkTitle">Four things that show up in my projects</title>
  <desc id="thinkDesc">Local first, with data staying on your own machine. Spec before code, with a docs folder in every repository. Small tools that remove a daily annoyance. And still playful, because software should be fun sometimes.</desc>

  <defs>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    .trait { font-size: 11px; letter-spacing: 1.6px; fill: #f59e0b; }
    .head  { font-size: 15px; fill: #e6edf6; }
    .note  { font-size: 12px; fill: #64748b; }
  </style>

  <g>
    <rect x="20" y="44" width="212" height="88" rx="12" fill="url(#cardFill)" stroke="#1e293b"/>
    <rect x="20" y="44" width="212" height="2" rx="1" fill="url(#cardTop)"/>
    <text class="trait" x="38" y="70">LOCAL FIRST</text>
    <text class="head" x="38" y="98">Own your data</text>
    <text class="note" x="38" y="118">git-vacuum · veil</text>
  </g>

  <g>
    <rect x="256" y="44" width="212" height="88" rx="12" fill="url(#cardFill)" stroke="#1e293b"/>
    <rect x="256" y="44" width="212" height="2" rx="1" fill="url(#cardTop)"/>
    <text class="trait" x="274" y="70">SPEC BEFORE CODE</text>
    <text class="head" x="274" y="98">Docs, then code</text>
    <text class="note" x="274" y="118">docs/ in every repo</text>
  </g>

  <g>
    <rect x="492" y="44" width="212" height="88" rx="12" fill="url(#cardFill)" stroke="#1e293b"/>
    <rect x="492" y="44" width="212" height="2" rx="1" fill="url(#cardTop)"/>
    <text class="trait" x="510" y="70">SMALL TOOLS</text>
    <text class="head" x="510" y="98">Fix small friction</text>
    <text class="note" x="510" y="118">Class-Spy · DoneSignal</text>
  </g>

  <g>
    <rect x="728" y="44" width="212" height="88" rx="12" fill="url(#cardFill)" stroke="#1e293b"/>
    <rect x="728" y="44" width="212" height="2" rx="1" fill="url(#cardTop)"/>
    <text class="trait" x="746" y="70">STILL PLAYFUL</text>
    <text class="head" x="746" y="98">Random episode?</text>
    <text class="note" x="746" y="118">episode-roulette</text>
  </g>
</svg>
